# Copy to config.toml and pass with:  python -m kalshi_btc_bot --config config.toml <command>
# Anything left out keeps the spec default.

[entry]
fast_ma = 50
slow_ma = 250
long_ma = 500
band_sd_mult = 2.0
breach_z = 2.0
breach_window_s = 120
yes_price_min = 0.30
yes_price_max = 0.70
yes_price_field = "ask"     # "ask" (what you pay), "last" (Oct 26 method) or "mid"

[trading]
quantity = 100              # contracts per signal
max_open_positions = 1
max_entries_per_contract = 1
entry_slippage = 0.02       # buy limit = signal price + 0.02
latency_s = 1
fee_rate = 0.07
live_exit_method = "bb20x5s_60s"
live_trading_enabled = false   # keep false; live routing is not implemented yet

[settlement]
window_s = 60
yes_if = ">="

